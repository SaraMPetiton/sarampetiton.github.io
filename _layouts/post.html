---
layout: default
body_class: notebook
---
<a class="back-link" href="{{ '/notebook/' | relative_url }}">&larr; Research notes</a>
<article>
  <header class="post-header">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
